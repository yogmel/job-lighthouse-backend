# PROJ-002: checks on every PR and push to main. Branch rules on main
# require these jobs to pass (see README → CI and hooks).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: uv.lock is up to date
        run: uv lock --check
      - name: Ruff lint
        run: uv run --frozen ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen ruff format --check .

  # PROJ-004: mypy settings and target files live in pyproject.toml.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: mypy
        run: uv run --frozen mypy

  # PROJ-004: SAST. Run with uvx at a pinned version (not a dev dependency),
  # so Semgrep's own tree stays out of uv.lock and pip-audit. tests/ is in
  # Semgrep's default ignore list.
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Keep in step with SEMGREP_VERSION in the Makefile.
      SEMGREP_VERSION: 1.178.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Semgrep (Python + FastAPI rules)
        run: >-
          uvx "semgrep@${SEMGREP_VERSION}" scan --metrics=off --error
          --config p/python --config p/fastapi
          src migrations

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Throwaway CI database, not a real credential.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Single Alembic head
        run: |
          heads="$(uv run --frozen alembic heads)"
          echo "$heads"
          if [ "$(echo "$heads" | grep -c .)" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head"
            exit 1
          fi
      - name: Migration round-trip
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
      # PROJ-004: coverage settings and fail_under live in pyproject.toml.
      - name: pytest
        run: uv run --frozen pytest --cov --cov-report=term
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage"
            echo
            uv run --frozen coverage report --format=markdown --fail-under=0
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          name: coverage-report
          path: coverage.md
          retention-days: 7

  # PROJ-004: coverage on the PR as one comment, updated on each push. A
  # separate job so the job that runs PR code never holds a write token.
  # Dependabot PRs get a read-only token, so they only get the job summary.
  coverage-comment:
    needs: test
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file coverage.md --edit-last --create-if-none

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: job-lighthouse-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # PROJ-003: same scan as deploy.yml, so a vulnerable image fails the PR,
      # not just the deploy. Pinned by commit SHA (trivy-action tags were
      # hijacked once); bump SHA and `version` together.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: job-lighthouse-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  # PROJ-003: secrets anywhere in the branch's history, not only the diff.
  # The repo is small, so a full scan every run is cheap.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Keep in step with the gitleaks rev in .pre-commit-config.yaml.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  # PROJ-003: known CVEs in locked dependencies (all groups: dev tools run
  # in CI too). Audits the lock export, not a venv, so pip-audit's own
  # dependencies don't end up in the report.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Export locked requirements
        run: uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: uvx pip-audit@2.10.1 --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
