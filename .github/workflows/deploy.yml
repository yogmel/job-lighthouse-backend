# PROJ-001: build the app image, push it to GHCR, deploy it to the droplet.
# One image serves migrate, job-runner and companies (compose picks the command).
# Droplet setup and secrets: docs/DEPLOY.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # PROJ-003: Trivy scan of the image goes here (build with load: true,
      # scan, then push).

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Backstop for a hung SSH session; deploy.sh's own --wait-timeout
    # normally fails first. A first deploy pulls every image, hence the room.
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DEPLOY_DIR: /opt/job-lighthouse
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: no StrictHostKeyChecking=no.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host droplet
            HostName $DROPLET_HOST
            User $DROPLET_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy compose, Nginx config and deploy script
        run: |
          # shellcheck disable=SC2029 # expanding on the runner is intended
          ssh droplet "mkdir -p $DEPLOY_DIR/nginx"
          scp docker-compose.yml deploy/deploy.sh "droplet:$DEPLOY_DIR/"
          scp nginx/default.conf "droplet:$DEPLOY_DIR/nginx/"

      - name: Deploy
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Token goes over stdin so it never shows up in a process list or log.
        run: |
          # shellcheck disable=SC2029 # expanding on the runner is intended
          printf '%s\n' "$GHCR_TOKEN" |
            ssh droplet "DEPLOY_DIR=$DEPLOY_DIR bash $DEPLOY_DIR/deploy.sh '$IMAGE' '$GHCR_USER'"
