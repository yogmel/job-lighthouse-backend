[project]
name = "job-lighthouse-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mellina Yonashiro", email = "yonashiro.mellina@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "google-auth>=2.59.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# S = Bandit security rules (PROJ-003). Silence a false positive inline,
# with a reason: `# noqa: S608 -- query built from constants only`.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts.
"tests/**" = ["S101"]
