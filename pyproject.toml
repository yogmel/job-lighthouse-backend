[project]
name = "job-lighthouse-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mellina Yonashiro", email = "yonashiro.mellina@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "google-auth>=2.59.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# S = Bandit security rules (PROJ-003). Silence a false positive inline,
# with a reason: `# noqa: S608 -- query built from constants only`.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare asserts; test fixtures use fake passwords and tokens.
"tests/**" = ["S101", "S105"]

[tool.mypy]
# PROJ-004: default ("basic") checking. Tighten per module later with
# [[tool.mypy.overrides]], e.g. `strict = true` for one package.
python_version = "3.13"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
# PROJ-004. SQLAlchemy's async engine runs queries in greenlets; without
# "greenlet" every line after an `await session...` counts as missed.
source = ["job_lighthouse_backend"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# PROJ-004: set when v0.2 landed (96% at the time). Raise it as tests grow.
fail_under = 90
show_missing = true
skip_covered = true
