# Reverse proxy in front of both services. Routes by path prefix.
# Certs are mounted at /etc/nginx/certs (see README → Nginx & TLS).

upstream companies {
    server companies:8000;
}

upstream job_runner {
    server job-runner:8000;
}

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No trailing slash on proxy_pass: the path is passed through unchanged.
    location ~ ^/(companies|auth|account)(/|$) {
        proxy_pass http://companies;
    }

    location ~ ^/(config|jobs|runs)(/|$) {
        proxy_pass http://job_runner;
    }

    # PROJ-014: public liveness check. 200 only if both services answer
    # /health: auth_request subrequests Companies, then Job Runner answers.
    location = /health {
        auth_request /_health/companies;
        proxy_pass http://job_runner;
    }

    location = /_health/companies {
        internal;
        proxy_pass http://companies/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        return 404;
    }
}
