# Postgres + both services behind Nginx.
# Secrets and POSTGRES_* come from .env (git-ignored).

x-app: &app
  build: .
  # On the droplet: the GHCR image for the deployed commit (see deploy/deploy.sh).
  image: ${APP_IMAGE:-job-lighthouse-backend}
  restart: unless-stopped
  environment:
    # Built here, not taken from .env: inside the network the DB host is
    # `postgres`, not localhost.
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Shared JWT signing secret: Companies issues tokens, both services validate.
    JWT_SECRET: ${JWT_SECRET:?set in .env}
    JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    # Comma-separated frontend origins allowed by CORS. Unset: none.
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    # Slim image has no curl.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: applies migrations, then exits. Services wait for it.
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  job-runner:
    <<: *app
    command: ["uvicorn", "job_lighthouse_backend.job_runner.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${JOB_RUNNER_PORT:-8001}:8000"

  companies:
    <<: *app
    command: ["uvicorn", "job_lighthouse_backend.companies.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${COMPANIES_PORT:-8002}:8000"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem. Locally: `make certs` (self-signed).
      - ${NGINX_CERTS_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      job-runner:
        condition: service_healthy
      companies:
        condition: service_healthy

volumes:
  pgdata:
